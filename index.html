<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST Product Calculator</title>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
    text-align:center;
}

.box{
    width:500px;
    background:white;
    margin:30px auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

select,input,button{
    width:90%;
    padding:10px;
    margin:10px;
}

button{
    background:green;
    color:white;
    border:none;
    cursor:pointer;
    font-size:16px;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse: collapse;
}

table,th,td{
    border:1px solid gray;
}

th,td{
    padding:8px;
}

.taxBox{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    font-size:18px;
}

.same{
    background:#d4edda;
}

.other{
    background:#fff3cd;
}

.final{
    background:#cce5ff;
}

</style>

</head>
<body>

<div class="box">

<h2>GST Product Calculator</h2>

<label>From State</label>
<select id="state1"></select>

<label>To State</label>
<select id="state2"></select>

<label>Select Product</label>

<select id="product">
<option value="">Choose Product</option>
</select>

<label>Rate</label>

<select id="rate">
<option value="">Choose Rate</option>
</select>

<input type="number" id="quantity"
placeholder="Enter Quantity">

<input type="text" id="unit"
placeholder="Unit" readonly>

<button onclick="addProduct()">
Add Product
</button>

<table id="productTable">

<tr>
<th>Product</th>
<th>Rate</th>
<th>Qty</th>
<th>Unit</th>
<th>Total</th>
<th>Tax Type</th>
</tr>

</table>

<button onclick="calculateGST()">
Calculate GST
</button>

<div id="result"></div>

</div>

<script>

/* STATES */

const states = [

"Andhra Pradesh","Arunachal Pradesh",
"Assam","Bihar","Chhattisgarh","Goa",
"Gujarat","Haryana","Himachal Pradesh",
"Jharkhand","Karnataka","Kerala",
"Madhya Pradesh","Maharashtra",
"Manipur","Meghalaya","Mizoram",
"Nagaland","Odisha","Punjab",
"Rajasthan","Sikkim","Tamil Nadu",
"Telangana","Tripura","Uttar Pradesh",
"Uttarakhand","West Bengal"

];

function fillStates(id)
{
    let dropdown =
    document.getElementById(id);

    states.forEach(function(state){

        let option =
        document.createElement("option");

        option.value = state;
        option.text = state;

        dropdown.add(option);

    });
}

fillStates("state1");
fillStates("state2");


/* PRODUCTS */

const products = {

    "Apple":{
        rates:[120,140,160],
        unit:"Kg",
        gst:5
    },

    "Banana":{
        rates:[50,60,70],
        unit:"Dozen",
        gst:5
    },

    "Monitor":{
        rates:[7000,8000,10000],
        unit:"Piece",
        gst:18
    },

    "Mouse":{
        rates:[400,500,700],
        unit:"Piece",
        gst:18
    },

    "Cloth":{
        rates:[600,900,1200],
        unit:"Piece",
        gst:18
    },

    "Chair":{
        rates:[2000,2500,3000],
        unit:"Piece",
        gst:18
    },

    "Keyboard":{
        rates:[900,1200,1500],
        unit:"Piece",
        gst:18
    }

};


/* PRODUCT DROPDOWN */

let productDropdown =
document.getElementById("product");

for(let item in products)
{
    let option =
    document.createElement("option");

    option.value = item;
    option.text = item;

    productDropdown.add(option);
}


/* CHANGE PRODUCT */

document.getElementById("product")
.addEventListener("change", function(){

    let selectedProduct = this.value;

    let rateDropdown =
    document.getElementById("rate");

    rateDropdown.innerHTML =
    `<option value="">Choose Rate</option>`;

    if(selectedProduct != "")
    {
        let rateList =
        products[selectedProduct].rates;

        rateList.forEach(function(rate){

            let option =
            document.createElement("option");

            option.value = rate;
            option.text = "₹" + rate;

            rateDropdown.add(option);

        });

        document.getElementById("unit").value =
        products[selectedProduct].unit;
    }

});


/* VARIABLES */

let productsData = [];


/* ADD PRODUCT */

function addProduct()
{
    let product =
    document.getElementById("product").value;

    let rate =
    parseFloat(
    document.getElementById("rate").value);

    let qty =
    parseInt(
    document.getElementById("quantity").value);

    let unit =
    document.getElementById("unit").value;

    let s1 =
    document.getElementById("state1").value;

    let s2 =
    document.getElementById("state2").value;

    if(product == "" || isNaN(rate) || qty <= 0)
    {
        alert("Please Select Product, Rate and Quantity");
        return;
    }

    if(s1 == "" || s2 == "")
    {
        alert("Please Select States");
        return;
    }

    let total = rate * qty;

    let gstPercent =
    products[product].gst;

    let gstAmount =
    total * gstPercent / 100;

    let taxType =
    (s1 === s2) ?
    "Same State" :
    "Other State";

    productsData.push({

        product:product,
        rate:rate,
        qty:qty,
        unit:unit,
        total:total,
        gst:gstAmount,
        taxType:taxType

    });

    let table =
    document.getElementById("productTable");

    let row = table.insertRow();

    row.insertCell(0).innerHTML = product;

    row.insertCell(1).innerHTML =
    "₹" + rate;

    row.insertCell(2).innerHTML =
    qty;

    row.insertCell(3).innerHTML =
    unit;

    row.insertCell(4).innerHTML =
    "₹" + total;

    row.insertCell(5).innerHTML =
    taxType;

    document.getElementById("quantity").value = "";
}


/* GST CALCULATION */

function calculateGST()
{
    if(productsData.length == 0)
    {
        document.getElementById("result")
        .innerHTML =
        "Please Add Products";

        return;
    }

    let sameGST = 0;

    let otherGST = 0;

    let grandTotal = 0;

    let finalTotal = 0;

    productsData.forEach(function(item){

        grandTotal += item.total;

        finalTotal += item.total + item.gst;

        if(item.taxType == "Same State")
        {
            sameGST += item.gst;
        }
        else
        {
            otherGST += item.gst;
        }

    });

    let cgst = sameGST / 2;

    let sgst = sameGST / 2;

    document.getElementById("result")
    .innerHTML =

    `
    <div class="taxBox same">

    <h3>Same State Tax</h3>

    CGST : ₹${cgst.toFixed(2)} <br><br>

    SGST : ₹${sgst.toFixed(2)}

    </div>

    <div class="taxBox other">

    <h3>Other State Tax</h3>

    IGST : ₹${otherGST.toFixed(2)}

    </div>

    <div class="taxBox final">

    <h3>Final Bill</h3>

    Product Total :
    ₹${grandTotal.toFixed(2)} <br><br>

    Final Amount :
    ₹${finalTotal.toFixed(2)}

    </div>
    `;
}

</script>

</body>
</html>
